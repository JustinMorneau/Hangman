<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hangman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Patrick+Hand&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="sheet">
    <header class="top">
      <h1>Hangman</h1>
      <form class="controls" id="controls" aria-label="Game settings">
        <fieldset class="difficulty">
          <legend class="visually-hidden">Difficulty</legend>
          <label><input type="radio" name="difficulty" value="easy"> Easy</label>
          <label><input type="radio" name="difficulty" value="medium" checked> Medium</label>
          <label><input type="radio" name="difficulty" value="hard"> Hard</label>
        </fieldset>
        <button type="submit" id="new-game" class="new-game">New game</button>
      </form>
    </header>

    <section class="board">
      <svg id="drawing" class="drawing" viewBox="0 0 200 230" role="img" aria-labelledby="drawing-label">
        <title id="drawing-label">Hangman drawing: 0 of 6 parts drawn</title>
        <g class="gallows">
          <line x1="20" y1="215" x2="140" y2="215" />
          <line x1="50" y1="215" x2="50" y2="20" />
          <line x1="50" y1="20" x2="140" y2="20" />
          <line x1="50" y1="55" x2="85" y2="20" />
          <line x1="140" y1="20" x2="140" y2="45" />
        </g>
        <g class="figure">
          <circle class="part" data-part="1" cx="140" cy="65" r="20" pathLength="1" />
          <line class="part" data-part="2" x1="140" y1="85" x2="140" y2="145" pathLength="1" />
          <line class="part" data-part="3" x1="140" y1="100" x2="112" y2="125" pathLength="1" />
          <line class="part" data-part="4" x1="140" y1="100" x2="168" y2="125" pathLength="1" />
          <line class="part" data-part="5" x1="140" y1="145" x2="116" y2="185" pathLength="1" />
          <line class="part" data-part="6" x1="140" y1="145" x2="164" y2="185" pathLength="1" />
        </g>
      </svg>

      <div class="play">
        <p id="pattern" class="pattern" aria-label="Word">&nbsp;</p>
        <p id="remaining" class="remaining">&nbsp;</p>
        <dl class="tally">
          <div><dt>Guessed</dt><dd id="guessed">none yet</dd></div>
          <div><dt>Misses</dt><dd id="misses" class="misses">none yet</dd></div>
        </dl>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="keyboard" class="keyboard" aria-label="Letters"></section>

    <p class="hint">Click a letter or type it on your keyboard.</p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
